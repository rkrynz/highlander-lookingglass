
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highlander LookingGlass</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Highlander LookingGlass</h1>
        <p class="subtitle">See Through the Scam.</p>

        <section class="scanner">
            <h2>Is this link suspicious?</h2>
            <p>Paste a website link below to check for warning signs.</p>

            <input
                id="urlInput"
                type="text"
                placeholder="https://example.com"
                aria-label="Website URL"
            >

            <button id="scanButton">Check Link</button>

            <div id="results" aria-live="polite"></div>
        </section>

        <p class="disclaimer">
            LookingGlass checks for basic warning signs.
            It cannot guarantee that a website is safe.
        </p>
    </main>

    <script src="script.js"></script>
</body>
</html>
